[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/assets/certificates/**"]

[dev]
  command = "npm run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  framework = "vite"
  autoLaunch = false
